[project]
name = "cadengbench-p-evaluator"
version = "0.6.4"
description = "Deterministic L0-L3 evaluators for CADEngBench-P"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "CADEngBench Research Team" }]
dependencies = [
  "cadquery>=2.6,<2.8",
  "jsonschema>=4.23,<5",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "z3-solver>=4.13,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]
l3 = [
  "gmsh==4.15.2",
  "httpx>=0.28,<0.29",
  "matplotlib>=3.10,<4",
  "pillow>=11,<13",
  "vtk==9.3.1",
]

[project.scripts]
cadengbench-p-eval = "cadengbench_p_eval.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadengbench_p_eval"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/evaluation_result.v1.schema.json" = "cadengbench_p_eval/_schemas/evaluation_result.v1.schema.json"
"schemas/evaluator_case.v1.schema.json" = "cadengbench_p_eval/_schemas/evaluator_case.v1.schema.json"
"schemas/l3_annotation_candidate.v1.schema.json" = "cadengbench_p_eval/_schemas/l3_annotation_candidate.v1.schema.json"
"schemas/l3_physics_card.v2.schema.json" = "cadengbench_p_eval/_schemas/l3_physics_card.v2.schema.json"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: executes CadQuery or OpenCascade",
  "canary: reads the repository-local 30-item canary",
  "mutation: verifies an intended semantic failure is detected",
  "l3: executes Gmsh or CalculiX",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
