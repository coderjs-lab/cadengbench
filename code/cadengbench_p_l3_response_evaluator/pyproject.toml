[project]
name = "cadengbench-p-l3-response"
version = "0.1.0"
description = "Separate structural-response fidelity evaluator for CADEngBench-P"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "CADEngBench V2 Research Team" }]
dependencies = [
  "cadengbench-p-evaluator",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
cadengbench-p-l3-response = "cadengbench_p_l3_response.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadengbench_p_l3_response"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/response_profile.v1.schema.json" = "cadengbench_p_l3_response/_schemas/response_profile.v1.schema.json"
"schemas/response_contract.v1.schema.json" = "cadengbench_p_l3_response/_schemas/response_contract.v1.schema.json"
"schemas/response_pair_result.v1.schema.json" = "cadengbench_p_l3_response/_schemas/response_pair_result.v1.schema.json"
"schemas/response_family_manifest.v1.schema.json" = "cadengbench_p_l3_response/_schemas/response_family_manifest.v1.schema.json"

[tool.uv.sources]
cadengbench-p-evaluator = { path = "../cadengbench_p_evaluator", editable = true }

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: executes CadQuery, Gmsh, or CalculiX",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
