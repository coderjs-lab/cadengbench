[project]
name = "cadengbench-p-runner"
version = "0.7.0"
description = "Provider-neutral candidate-model runner for CADEngBench-P"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "CADEngBench Research Team" }]
dependencies = [
  "google-genai>=1,<2",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
cadengbench-p-run = "cadengbench_p_runner.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadengbench_p_runner"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "canary: reads the repository-local synchronized CADEngBench-P canary",
  "integration: starts a local HTTP endpoint",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
